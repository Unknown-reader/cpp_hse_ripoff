name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BUILD_DIR: build

jobs:
  release:
    name: Публикация релиза
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Release-сборка
        run: make build BUILD_TYPE=Release CMAKE_FLAGS=-DWERROR=ON

      - name: Упаковка приложений
        run: |
          mkdir -p dist
          shopt -s nullglob
          for app in build/*/hw*_app; do
            hw_dir="$(basename "$(dirname "$app")")"
            cp "$app" "dist/${hw_dir}-$(basename "$app")"
          done
          ls -l dist

      - name: Публикация в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
