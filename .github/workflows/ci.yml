name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_DIR: build

jobs:
  build-and-test:
    name: Сборка и тесты (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cc: gcc, cxx: g++ }
          - { compiler: clang, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_FLAGS: -DWERROR=ON
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang

      - name: Настройка ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.compiler }}

      - name: Сборка
        run: make build

      - name: Тесты
        run: make test

  sanitizers:
    name: Санитайзеры (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
      CMAKE_FLAGS: -DWERROR=ON
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Сборка и тесты под санитайзерами
        run: make sanitize

  quality:
    name: Качество кода
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang clang-format clang-tidy cppcheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Установка cpplint
        run: pip install cpplint

      - name: Конфигурация
        run: make configure

      - name: Проверка форматирования (clang-format)
        run: make format-check

      - name: Стиль Google (cpplint)
        run: make lint-style

      - name: Статический анализ (clang-tidy, cppcheck)
        run: make lint-tidy lint-cppcheck

  coverage:
    name: Покрытие
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Установка gcovr
        run: pip install gcovr

      - name: Сбор покрытия
        run: make coverage

      - name: Сводка покрытия
        run: cat coverage/coverage.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Загрузка отчёта покрытия
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
