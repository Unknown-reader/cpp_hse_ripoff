name: Coverage Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сбор отчета покрытия
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev g++ make

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Установка gcovr
        run: pip install gcovr

      - name: Сбор покрытия
        run: make coverage

      - name: Подготовка артефакта Pages
        run: touch coverage/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: coverage

  deploy:
    name: Деплой на GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
